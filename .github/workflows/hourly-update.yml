name: Hourly update

on:
  schedule:
    - cron: "0 * * * *" # 毎時0分（UTC）。GitHub 側の混雑で数分〜十数分遅れることがあります
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch news (RSS)
        run: node scripts/fetch-news.mjs

      - name: Fetch markets
        run: node scripts/fetch-markets.mjs

      - name: Analyze with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL || 'claude-sonnet-5-5' }}
          ANALYSIS_EFFORT: ${{ vars.ANALYSIS_EFFORT || 'medium' }}
          MAX_ANALYZE_PER_RUN: ${{ vars.MAX_ANALYZE_PER_RUN || '40' }}
        run: node scripts/analyze.mjs

      - name: Validate JSON
        run: node scripts/validate-data.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "データに変更なし"
            exit 0
          fi
          sed -i "s#<lastmod>.*</lastmod>#<lastmod>$(date -u +%Y-%m-%dT%H:%M:%S+00:00)</lastmod>#" sitemap.xml
          git add data sitemap.xml
          git commit -m "chore(data): hourly update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp -r index.html 404.html robots.txt sitemap.xml .nojekyll assets css js _site/
          mkdir -p _site/data
          # raw-news.json（RSS概要を含む中間データ）は公開しない
          cp data/news.json data/markets.json data/ai-competitors.json data/fetch-log.json _site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
